<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e40af" />
      <stop offset="50%" stop-color="#1d4ed8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.25"/>
    </filter>
  </defs>
  
  <!-- Fondo Azul -->
  <rect width="800" height="600" fill="url(#bgGrad)" />
  
  <!-- Marco Sutil -->
  <rect x="25" y="25" width="750" height="550" rx="20" fill="none" stroke="#ffffff" stroke-opacity="0.18" stroke-width="2.5" />
  
  <!-- Icono de Caja/Producto Tecnológico -->
  <g transform="translate(400, 240)" filter="url(#shadow)">
    <path d="M-40,-25 L0,-45 L40,-25 L40,25 L0,45 L-40,25 Z" fill="none" stroke="#ffffff" stroke-width="4.5" stroke-linejoin="round" />
    <path d="M0,-45 L0,45" stroke="#ffffff" stroke-width="3.5" stroke-opacity="0.6" />
    <path d="M-40,-25 L0,-5 L40,-25" fill="none" stroke="#ffffff" stroke-width="3.5" stroke-opacity="0.6" />
  </g>
  
  <!-- Texto PRODUCTO -->
  <text x="400" y="360" 
        text-anchor="middle" 
        fill="#ffffff" 
        font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" 
        font-size="54" 
        font-weight="800" 
        letter-spacing="6"
        filter="url(#shadow)">PRODUCTO</text>
</svg>
